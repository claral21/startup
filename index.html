<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEtronome</title>
    <link rel="icon" href="metronome_icon2.png" />
    <link rel="stylesheet" href="styles.css"
  </head>
  <body>
    <header>
      <h1>Welcome to MEtronome</h1>
      <nav>
        <menu class="navigation">
          <li><a class="Hyperlink" href="index.html">Login</a></li>
          <li><a class="Hyperlink" href="soundmaker.html">Start</a></li>
        </menu>
      </nav>
    </header>

    <main>
      <h2>Login or Create an Account</h2>
      <form method="get" action="soundmaker.html" id="login_form">
        <div>
          <label for="username">Username:</label>
          <input type="text" placeholder="type here" id="username">
        </div>
        <div>
          <label for="password">Password:</label>
          <input type="password" placeholder="password" id="password"/>
        </div>
        <div class="login_buttons">
        <button type="submit" name="login" value="access_user_info">Login</button>
        <button type="submit" name="create_user" value="save_new_user">Create</button>
        </div>
      </form>
      <div id="metronome_container1">
      <img src="metronome_icon2.png" alt="MetronomeIMG1" width="300">
      </div>
    </main>
    <footer>
      <div class="footer_words">
      <span class="text-reset">Author Name: Clara Pitts</span>
      <a class="Hyperlink" href="https://github.com/claral21/startup">GitHub</a>
      </div>
    </footer>
  </body>
</html>
