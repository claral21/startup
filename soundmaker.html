<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MEtronome</title>
        <link rel="icon" href="metronome_icon2.png" />
    </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <h1>Sound Workshop</h1>
      <nav>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu>
          <li><a href="index.html">Login</a></li>
          <li><a href="soundmaker.html">Start</a></li>
        </menu>
      </nav>
      <h3>
        Hello [User Name]! Begin by recording your own sound or selecting a random one!
      </h3>

      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
      <hr />
    </header>
    <main>
        <aside>
             <table style="margin-left: auto; display: block; width: max-content;">
        <tr>
            <th>Latest</th>
            <th>MEtronome Makers</th>
        </tr>
        <tr>
            <td>Sam</td>
            <td>Made a New Sound</td>
        </tr>
        <tr>
            <td>Jamie</td>
            <td>Made a New Sound</td>
        </tr>
        <tr>
            <td>Elaina</td>
            <td>Made a New Sound</td>
        </tr>
      </table>
        </aside>
        <!--My main code goes here! -->
        <img src="metronome_icon2.png" alt="MetronomeIMG" width="300">
        <form>
            <div>
                <label for="number">Tempo: </label>
                <input type="number" name="vNumber" id="number" min="10" max="150" step="5" />  
            </div>
            <label for="text">Name/Rename current sound: </label>
            <input type="text" id="text" name="vText" />
            <button type="submit">Save</button>
            <label for="select">Saved Sounds: </label>
            <select id="select" name="vSelect">
                <option>Chicken_sound</option>
                <option selected>Bells</option>
                <option>Random1</option>
            </select>
            <div>
                <audio controls src="https://raw.githubusercontent.com/webprogramming260/webprogramming/main/instruction/html/media/testAudio.mp3">Filler Audio</audio>
                <button type="button">Generate Random Sound</button>
            </div>
        </form>
    </main>
    <footer>
      <hr />
      <span class="text-reset">Author Name: Clara Pitts</span>
      <br />
      <a href="https://github.com/claral21/startup">GitHub</a>
    </footer>
  </body>
</html>
