<!DOCTYPE html>
<html lang="en">
  
  <head>
    <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MEtronome</title>
        <link rel="icon" href="metronome_icon2.png" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="styles.css">
    </head>
  <body>
    <header>
      <h1 class="custom_font">Sound Workshop</h1>
      <nav>
        <menu class="navigation">
          <li><a class="Hyperlink" href="index.html">Login</a></li>
          <li><a class="Hyperlink" href="soundmaker.html">Start</a></li>
        </menu>
      </nav>
      <hr />
    </header>
    <main>
      <h3 class="custom_font">
        Hello [User Name]! Begin by recording your own sound or selecting a random one!
      </h3>
        <aside class="custom_font">
             <table>
        <tr>
            <th>Latest </th>
            <th> MEtronome Makers</th>
        </tr>
        <tr>
            <td>Sam</td>
            <td>Made a New Sound</td>
        </tr>
        <tr>
            <td>Jamie</td>
            <td>Made a New Sound</td>
        </tr>
        <tr>
            <td>Elaina</td>
            <td>Made a New Sound</td>
        </tr>
      </table>
        </aside>
      <div id="button_metronome_align">
      <form id="soundmaker_buttons">
            <div>
                <audio controls src="https://raw.githubusercontent.com/webprogramming260/webprogramming/main/instruction/html/media/testAudio.mp3">Filler Audio</audio>
            </div>
            <button type="button">Generate Random Sound</button>
            <div>
                <label for="number">Tempo: </label>
                <input type="number" name="vNumber" id="number" min="10" max="150" step="5" />  
            </div>
            <div>
            <label for="text">Name/Rename current sound: </label>
            <input type="text" id="text" name="vText" placeholder="Sound Name"/>
            <button type="submit">Save</button>
            </div>
            <label for="select">Saved Sounds: </label>
            <select id="select" name="vSelect">
                <option>Chicken_sound</option>
                <option selected>Bells</option>
                <option>Random1</option>
            </select>
            
        </form>
        <!--My main code goes here! -->
        <div id="metronome_container2">
        <img src="metronome_icon2.png" alt="MetronomeIMG" width="300">
        </div>
        </div>
        
    </main>
    <footer>
      <div class="footer_words">
      <span class="text-reset">Author Name: Clara Pitts</span>
      <a class="Hyperlink" href="https://github.com/claral21/startup">GitHub</a>
      </div>
    </footer>
  </body>
</html>
